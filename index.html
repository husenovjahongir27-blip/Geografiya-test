function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function start(){
 const name=$("name").value.trim();if(!name){alert("O‘quvchi F.I.Sh. ni kiriting.");return}
 const subject=$("subject").value,count=Number($("count").value);
 let bank=[];
 if(subject==="__ALL__") Object.entries(BANK).forEach(([s,arr])=>arr.forEach(q=>bank.push([q[0],q[1],q[2],s])));
 else BANK[subject].forEach(q=>bank.push([q[0],q[1],q[2],subject]));

}

 const q=qs[i];$("qn").textContent=`Savol ${i+1}/${qs.length}`;$("bar").style.width=((i+1)/qs.length*100)+"%";$("question").textContent=q[0];$("options").innerHTML="";

 $("prev").disabled=i===0;$("next").textContent=i===qs.length-1?"🏁 Yakunlash":"Keyingi →";
}
function next(){if(ans[i]===null){alert("Avval javobni belgilang.");return}if(i<qs.length-1){i++;render()}else finish()}
function prev(){if(i>0){i--;render()}}
async function finish(){
 clearInterval(timerId);let correct=0,details=[];
 qs.forEach((q,k)=>{const ok=ans[k]===q[2];if(ok)correct++;details.push({number:k+1,isCorrect:ok,userAnswer:ans[k]===null?"Javob berilmagan":String.fromCharCode(65+ans[k])+") "+q[1][ans[k]],correctAnswer:String.fromCharCode(65+q[2])+") "+q[1][q[2]],subject:q[3]})});

}
$("start").onclick=start;$("next").onclick=next;$("prev").onclick=prev;
