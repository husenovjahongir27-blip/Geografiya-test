const $=id=>document.getElementById(id);
let qs=[],answers=[],idx=0,seconds=0,timer=null;

for(let g=5;g<=11;g++) $("grade").add(new Option(g+"-sinf",String(g)));

function subjects(){
  const g=$("grade").value;
  $("subject").innerHTML="";
  const subjects=Object.keys(BANK[g]||{});
  subjects.forEach(s=>$("subject").add(new Option(s,s)));
  $("hint").textContent=subjects.length
    ? "Tanlangan sinfda mavjud fanlar: "+subjects.length+" ta."
    : "Avval sinfni tanlang.";
}

$("grade").addEventListener("change",subjects);
subjects();

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function render(){
  if(!qs.length) return;
  const q=qs[idx];
  $("num").textContent="Savol "+(idx+1)+"/"+qs.length;
  $("q").textContent=q[0];
  $("opts").innerHTML="";
  q[1].forEach((v,j)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="opt"+(answers[idx]===j?" chosen":"");
    b.textContent=String.fromCharCode(65+j)+") "+v;
    b.addEventListener("click",()=>{
      answers[idx]=j;
      render();
    });
    $("opts").appendChild(b);
  });
  $("next").textContent=idx===qs.length-1?"🏁 Yakunlash":"Keyingi →";
}

function start(){
  const name=$("name").value.trim();
  const grade=$("grade").value;
  const subject=$("subject").value;
  const count=Math.max(1,parseInt($("count").value,10)||30);
  const timeMinutes=Math.max(1,parseInt($("time").value,10)||10);

  if(!name){
    alert("F.I.Sh. kiriting!");
    $("name").focus();
    return;
  }
  if(!grade){
    alert("Sinfni tanlang!");
    return;
  }
  if(!subject){
    alert("Fan tanlang!");
    return;
  }

  const source=(BANK[grade]||{})[subject];
  if(!Array.isArray(source)||source.length===0){
    alert("Tanlangan fan bo‘yicha testlar topilmadi.");
    return;
  }

let pool=source.map(x=>{
  const options=x[1].map((text,index)=>({text,index}));
  shuffle(options);

  const correctIndex=options.findIndex(o=>o.index===x[2]);

  return [
    x[0],
    options.map(o=>o.text),
    correctIndex
  ];
});

shuffle(pool);

  qs=pool.slice(0,Math.min(count,pool.length));
  answers=Array(qs.length).fill(null);
  idx=0;
  seconds=timeMinutes*60;

  clearInterval(timer);

  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("test").classList.remove("hidden");

  updateTimer();
  render();

  timer=setInterval(()=>{
    seconds--;
    updateTimer();
    if(seconds<=0){
      clearInterval(timer);
      finish();
    }
  },1000);
}

function updateTimer(){
  const safe=Math.max(0,seconds);
  const m=Math.floor(safe/60);
  const s=safe%60;
  $("timer").textContent="⏱ "+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function prev(){
  if(idx>0){
    idx--;
    render();
  }
}

function next(){
  if(answers[idx]===null){
    alert("Avval javobni belgilang.");
    return;
  }
  if(idx<qs.length-1){
    idx++;
    render();
  }else{
    finish();
  }
}

async function finish(){
  if(!qs.length) return;
  clearInterval(timer);

  const details=qs.map((q,k)=>{
    const ok=answers[k]===q[2];
    return {
      isCorrect:ok,
      number:k+1,
      userAnswer:answers[k]===null?"Javob berilmagan":q[1][answers[k]],
      correctAnswer:q[1][q[2]]
    };
  });

  const correct=details.filter(x=>x.isCorrect).length;
  const total=qs.length;
  const wrong=total-correct;
  const percent=correct/total*100;
  const gradeMark=percent>=86?5:percent>=71?4:percent>=56?3:2;

  $("test").classList.add("hidden");
  $("result").classList.remove("hidden");

  $("summary").innerHTML=
    "👨‍🎓 "+escapeHtml($("name").value.trim())+"<br>"+
    "📱 "+escapeHtml($("phone").value.trim()||"Ko‘rsatilmagan")+"<br>"+
    "🏫 "+escapeHtml($("grade").value)+"-sinf<br>"+
    "📚 "+escapeHtml($("subject").value)+"<br>"+
    "⏱️ Vaqt: "+escapeHtml($("time").value)+" daqiqa<br>"+
    "🔢 "+total+" ta<br>"+
    "✅ "+correct+" ta<br>"+
    "❌ "+wrong+" ta<br>"+
    "📊 "+percent.toFixed(1)+"%<br>"+
    "🏆 Baho: "+gradeMark;

  $("detail").innerHTML=details.map(x=>
    '<div class="'+(x.isCorrect?"good":"bad")+'">'+
    (x.isCorrect?"✅":"❌")+" "+x.number+". "+
    escapeHtml(x.userAnswer)+
    (x.isCorrect?"":" → <b>"+escapeHtml(x.correctAnswer)+"</b>")+
    "</div>"
  ).join("");

  try{
    await fetch("/api/result",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        student:$("name").value.trim(),
        phone:$("phone").value.trim(),
        className:$("grade").value+"-sinf",
        subject:$("subject").value,
        time:Number($("time").value),
        total,correct,wrong,
        percent:percent.toFixed(1),
        grade:gradeMark,
        details
      })
    });
  }catch(e){
    console.error("Natijani serverga yuborishda xatolik:",e);
  }
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}
</script></body></html>
